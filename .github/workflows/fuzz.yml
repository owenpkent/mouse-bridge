name: Fuzz

# Fuzzes the ESP32-S31 report path: 60 seconds on each pull request, 30 minutes
# nightly. The working corpus carries over between runs in the Actions cache. Any
# finding fails the job, and the reproducing input is uploaded so it can be committed
# to tests/fuzz/corpus as a permanent regression test. See tests/fuzz/README.md.

on:
  pull_request:
  schedule:
    - cron: "41 5 * * *" # 05:41 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev ninja-build

      - name: Configure
        run: |
          cmake -S tests/host -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DMOUSE_BRIDGE_HOST_SANITIZE=ON -DMOUSE_BRIDGE_HOST_FUZZ=ON

      - name: Build
        run: cmake --build build-host --target report_fuzz

      - name: Restore the working corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || '1800' }}
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mkdir -p fuzz-corpus
          build-host/report_fuzz fuzz-corpus tests/fuzz/corpus \
            -max_total_time="$FUZZ_SECONDS" -max_len=4096 -timeout=10 -rss_limit_mb=2048

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore
          retention-days: 30
