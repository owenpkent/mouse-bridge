name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [rpipico2w, rpipicow]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
      - name: Install arduino-pico core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040
          arduino-cli core list
      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn "rp2040:rp2040:${{ matrix.board }}:ipbtstack=ipv4btcble,usbstack=picosdk" \
            --warnings default \
            --output-dir build \
            firmware/mouse_bridge
          mv build/mouse_bridge.ino.uf2 "mouse_bridge-${{ matrix.board }}.uf2"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mouse_bridge-${{ matrix.board }}
          path: mouse_bridge-${{ matrix.board }}.uf2
          retention-days: 7

  compile-esp32s31:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the report parser
        working-directory: firmware/mouse_bridge_esp32s31/test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I../main \
            test_mouse_report.c ../main/mouse_report.c -o "$RUNNER_TEMP/test_mouse_report"
          "$RUNNER_TEMP/test_mouse_report"
      - name: Compile
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v6.1
          target: esp32s31
          path: firmware/mouse_bridge_esp32s31
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mouse_bridge-esp32s31
          path: |
            firmware/mouse_bridge_esp32s31/build/mouse_bridge_esp32s31.bin
            firmware/mouse_bridge_esp32s31/build/bootloader/bootloader.bin
            firmware/mouse_bridge_esp32s31/build/partition_table/partition-table.bin
            firmware/mouse_bridge_esp32s31/build/flash_args
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: Publish release with UF2 files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # 0.x releases are pre-releases until hardware testing is done.
          pre=""; case "$TAG" in v0.*) pre="--prerelease";; esac
          gh release create "$TAG" *.uf2 --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes $pre
